# Template for SmartQueue Production Secrets
# IMPORTANT: DO NOT COMMIT REAL SECRET VALUES TO VERSION CONTROL.
# Populate via External Secrets Operator, HashiCorp Vault, or CI/CD secrets manager.
apiVersion: v1
kind: Secret
metadata:
  name: smartqueue-secrets
  labels:
    app.kubernetes.io/name: smartqueue
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_WITH_DB_USERNAME"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_DB_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_SECURE_256BIT_BASE64_JWT_SECRET"
  AI_SERVICE_SECRET: "REPLACE_WITH_INTERNAL_SHARED_AI_SECRET"
