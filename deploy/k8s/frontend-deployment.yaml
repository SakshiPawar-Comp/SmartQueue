apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartqueue-frontend
  labels:
    app.kubernetes.io/name: smartqueue-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smartqueue-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartqueue-frontend
    spec:
      containers:
        - name: frontend
          image: smartqueue-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smartqueue-frontend-service
  labels:
    app.kubernetes.io/name: smartqueue-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: smartqueue-frontend
