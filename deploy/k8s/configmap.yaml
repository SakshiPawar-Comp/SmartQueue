apiVersion: v1
kind: ConfigMap
metadata:
  name: smartqueue-config
  labels:
    app.kubernetes.io/name: smartqueue
data:
  SPRING_PROFILES_ACTIVE: "prod"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "smartqueue"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  SMARTQUEUE_AI_SERVICE_URL: "http://smartqueue-ai-service:8000"
  CORS_ALLOWED_ORIGINS: "https://smartqueue.example.com"
  REFRESH_TOKEN_SECURE: "true"
  SECURITY_HSTS_ENABLED: "true"
  DB_POOL_MIN_IDLE: "5"
  DB_POOL_MAX_SIZE: "20"
