apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartqueue-backend
  labels:
    app.kubernetes.io/name: smartqueue-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smartqueue-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartqueue-backend
    spec:
      containers:
        - name: backend
          image: smartqueue-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: smartqueue-config
            - secretRef:
                name: smartqueue-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: smartqueue-backend-service
  labels:
    app.kubernetes.io/name: smartqueue-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: smartqueue-backend
