apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartqueue-ai-service
  labels:
    app.kubernetes.io/name: smartqueue-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smartqueue-ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartqueue-ai-service
    spec:
      containers:
        - name: ai-service
          image: smartqueue-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AI_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartqueue-secrets
                  key: AI_SERVICE_SECRET
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smartqueue-ai-service
  labels:
    app.kubernetes.io/name: smartqueue-ai-service
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: smartqueue-ai-service
