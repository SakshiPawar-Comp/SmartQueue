spring:
  datasource:
    url: jdbc:h2:mem:smartqueue;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

jwt:
  secret: test-secret-that-is-at-least-32-bytes-long!
  issuer: smartqueue-test
  expiration:
    access: 900000
    refresh: 604800000

smartqueue:
  refresh-token:
    secure: false
