spring:
  datasource:
    url: jdbc:h2:file:./data/smartqueue_dev;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

jwt:
  secret: dev-only-secret-that-is-at-least-32-bytes!!
  issuer: smartqueue-dev
  expiration:
    access: 900000
    refresh: 604800000

smartqueue:
  phase: "Phase 1 - project setup and architecture (dev)"
  refresh-token:
    secure: false
